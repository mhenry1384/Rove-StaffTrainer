<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ee">
  <title>Grand Staff Trainer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202b3c;
      background: #f6f4ee;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --ink: #202b3c;
      --muted: #657185;
      --line: #dce1e8;
      --blue: #355de5;
      --blue-dark: #2347c6;
      --surface: #fff;
      --green: #18764a;
      --red: #b63a3a;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px 48px;
      background:
        radial-gradient(ellipse at 50% -10%, #fff 0, transparent 62%),
        #f6f4ee;
    }

    button, select { font: inherit; }

    .app {
      width: min(820px, 100%);
      margin: 0 auto;
    }

    header { margin-bottom: 24px; }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: .73rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      letter-spacing: -.045em;
      line-height: 1.1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .panel {
      overflow: hidden;
      border: 1px solid #e8e6df;
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 16px 40px #28334a0d, 0 2px 6px #28334a08;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 18px;
      padding: 20px 24px;
      border-bottom: 1px solid #edf0f3;
    }

    .setting-label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .75rem;
      font-weight: 750;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .level-setting { width: 150px; }

    select {
      width: 100%;
      min-height: 44px;
      padding: 0 36px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-weight: 650;
    }

    .options-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-weight: 650;
    }

    .options-button:hover { border-color: #9aabf4; background: #f5f7ff; }
    .options-button svg { width: 18px; height: 18px; flex: none; }

    dialog {
      width: min(460px, calc(100% - 32px));
      padding: 24px;
      border: 0;
      border-radius: 20px;
      background: var(--surface);
      color: var(--ink);
      box-shadow: 0 24px 60px #28334a33;
    }

    dialog::backdrop { background: #202b3c66; }

    dialog h2 {
      margin: 0 0 18px;
      font-size: 1.25rem;
      letter-spacing: -.02em;
    }

    .dialog-field { margin-bottom: 18px; }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .done-button {
      min-height: 42px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: #fff;
      cursor: pointer;
      font-weight: 750;
    }

    .done-button:hover { background: var(--blue-dark); }

    .mode-switch {
      display: flex;
      gap: 4px;
      padding: 4px;
      border-radius: 12px;
      background: #f1f3f7;
    }

    .mode-button {
      flex: 1;
      min-height: 36px;
      padding: 7px 10px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #596579;
      cursor: pointer;
      font-size: .87rem;
      font-weight: 700;
      transition: background .15s, color .15s, box-shadow .15s;
    }

    .mode-button[aria-pressed="true"] {
      background: #fff;
      color: var(--ink);
      box-shadow: 0 1px 4px #202b3c1a;
    }

    button:focus-visible, select:focus-visible {
      outline: 3px solid #8da3ff;
      outline-offset: 2px;
    }

    .practice {
      padding: 18px 22px 24px;
      text-align: center;
    }

    .round-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 0 auto 4px;
      width: min(620px, 100%);
      color: var(--muted);
      font-size: .83rem;
      font-weight: 650;
    }

    .round-info strong { color: var(--ink); }

    .staff-wrap {
      width: min(680px, 100%);
      margin: 0 auto;
    }

    .staff-wrap.find { width: 100%; }

    #staff {
      display: block;
      width: 100%;
      height: auto;
      margin: 0 auto;
      overflow: visible;
    }

    /* In "Find it" the staff is drawn at a fixed, enlarged size (width set
       from script) and only shrinks when the screen is too narrow. */
    .staff-wrap.find #staff { max-width: 100%; }
    .staff-wrap.find .staff-line,
    .staff-wrap.find .ledger-line { stroke-width: 2.4; }

    .staff-line, .ledger-line {
      stroke: #344052;
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    /* Size and position are set from script (see drawClef). */
    .clef { fill: #25334b; }

    .notehead {
      fill: #26344b;
      stroke: #26344b;
      stroke-width: 1.3;
    }

    .stem {
      stroke: #26344b;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .highlight-box {
      fill: #355de524;
      stroke: var(--blue);
      stroke-width: 1.5;
      vector-effect: non-scaling-stroke;
    }

    .notehead.ghost { fill: #355de540; stroke: #355de599; }
    .notehead.correct { fill: var(--green); stroke: var(--green); }
    .notehead.wrong { fill: var(--red); stroke: var(--red); opacity: .8; }

    .find-hit {
      fill: transparent;
      pointer-events: all;
      cursor: pointer;
      outline: none;
    }

    .find-hit:focus-visible {
      stroke: #8da3ff;
      stroke-width: 1.5;
    }

    .feedback {
      min-height: 28px;
      margin: 4px 0 14px;
      color: var(--muted);
      font-size: .95rem;
      font-weight: 700;
    }

    .feedback .target-letter {
      color: var(--blue);
      font-size: 1.7rem;
      font-weight: 850;
      vertical-align: -2px;
    }

    .feedback.correct { color: var(--green); }
    .feedback.incorrect { color: var(--red); }

    .answer-buttons {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
      width: min(560px, 100%);
      margin: 0 auto;
    }

    .answer-button {
      min-height: 54px;
      border: 1px solid #dfe4eb;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font-size: 1.18rem;
      font-weight: 800;
      transition: transform .12s, border-color .12s, background .12s, color .12s;
    }

    .answer-button:hover {
      transform: translateY(-2px);
      border-color: #9aabf4;
      background: #f5f7ff;
    }

    .answer-button:active { transform: translateY(0); }

    .answer-buttons[hidden] { display: none; }

    .storage-notice {
      display: none;
      margin: 14px auto 0;
      color: #8a4c13;
      font-size: .82rem;
    }

    .storage-notice.visible { display: block; }

    .hint {
      margin: 17px 0 0;
      color: #778194;
      font-size: .78rem;
    }

    @media (max-width: 560px) {
      body { padding: 24px 12px 32px; }
      .settings { gap: 14px; padding: 17px 16px; }
      .level-setting { width: 120px; }
      .mode-button { font-size: .78rem; }
      .practice { padding: 15px 10px 21px; }
      .answer-buttons { gap: 6px; }
      .answer-button { min-height: 48px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <p class="eyebrow">Read it. Name it. Play it.</p>
      <h1>Grand Staff Trainer</h1>
      <p class="subtitle">Practice recognizing notes one step at a time. Choose a level and staff style to get started.</p>
    </header>

    <section class="panel" aria-label="Note reading practice">
      <div class="settings">
        <label class="level-setting">
          <span class="setting-label">Difficulty</span>
          <select id="level" aria-label="Choose level"></select>
        </label>
        <button id="options-button" class="options-button" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="17" x2="20" y2="17"/>
            <circle cx="9" cy="7" r="2.5" fill="#fff"/><circle cx="15" cy="17" r="2.5" fill="#fff"/>
          </svg>
          <span>Options</span>
        </button>
      </div>

      <dialog id="options-dialog" aria-labelledby="options-title">
        <h2 id="options-title">Practice options</h2>
        <div class="dialog-field">
          <span class="setting-label">Staff style</span>
          <div class="mode-switch" role="group" aria-label="Choose staff style">
            <button class="mode-button" type="button" data-mode="grand" aria-pressed="true">Grand staff</button>
            <button class="mode-button" type="button" data-mode="treble" aria-pressed="false">Treble · guitar range</button>
          </div>
        </div>
        <div class="dialog-field">
          <span class="setting-label">Question</span>
          <div class="mode-switch" role="group" aria-label="Choose question type">
            <button class="mode-button" type="button" data-quiz="name" aria-pressed="true">Name it</button>
            <button class="mode-button" type="button" data-quiz="find" aria-pressed="false">Find it</button>
            <button class="mode-button" type="button" data-quiz="both" aria-pressed="false">Both</button>
          </div>
        </div>
        <form method="dialog" class="dialog-actions">
          <button class="done-button" type="submit">Done</button>
        </form>
      </dialog>

      <div class="practice">
        <div class="round-info">
          <span id="level-description">Level 1 · 3 notes</span>
          <span>Correct: <strong id="score">0</strong></span>
        </div>
        <div id="staff-wrap" class="staff-wrap">
          <svg id="staff" viewBox="0 0 700 440" role="img" aria-label="A note on the grand staff"></svg>
        </div>
        <p id="feedback" class="feedback" aria-live="polite">Which note is this?</p>
        <div id="answer-buttons" class="answer-buttons" role="group" aria-label="Choose the note name">
          <button class="answer-button" type="button" data-letter="A">A</button>
          <button class="answer-button" type="button" data-letter="B">B</button>
          <button class="answer-button" type="button" data-letter="C">C</button>
          <button class="answer-button" type="button" data-letter="D">D</button>
          <button class="answer-button" type="button" data-letter="E">E</button>
          <button class="answer-button" type="button" data-letter="F">F</button>
          <button class="answer-button" type="button" data-letter="G">G</button>
        </div>
        <p id="storage-notice" class="storage-notice" role="status"></p>
        <p id="hint" class="hint">You can also answer with the A–G keys.</p>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "grand-staff-trainer-settings";
      const LETTERS = ["C", "D", "E", "F", "G", "A", "B"];
      const LETTER_INDEX = Object.fromEntries(LETTERS.map((letter, index) => [letter, index]));
      const levelSelect = document.querySelector("#level");
      const staff = document.querySelector("#staff");
      const description = document.querySelector("#level-description");
      const feedback = document.querySelector("#feedback");
      const scoreDisplay = document.querySelector("#score");
      const storageNotice = document.querySelector("#storage-notice");
      const modeButtons = [...document.querySelectorAll("[data-mode]")];
      const quizButtons = [...document.querySelectorAll("[data-quiz]")];
      const staffWrap = document.querySelector("#staff-wrap");
      const answerButtons = document.querySelector("#answer-buttons");
      const hint = document.querySelector("#hint");
      const optionsButton = document.querySelector("#options-button");
      const optionsDialog = document.querySelector("#options-dialog");
      let mode = "grand";
      let quiz = "name";          // setting: "name", "find" or "both"
      let questionType = "name";  // type of the question currently shown
      let level = 1;
      let currentNote = null;
      let previousPitch = null;
      let score = 0;

      for (let number = 1; number <= 15; number += 1) {
        const option = document.createElement("option");
        option.value = String(number);
        option.textContent = `Level ${number}`;
        levelSelect.append(option);
      }

      function readSettings() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
          if (Number.isInteger(saved.level) && saved.level >= 1 && saved.level <= 15) {
            level = saved.level;
          }
          if (saved.mode === "grand" || saved.mode === "treble") {
            mode = saved.mode;
          }
          if (["name", "find", "both"].includes(saved.quiz)) {
            quiz = saved.quiz;
          }
        } catch {
          showStorageNotice("Saved settings could not be read. Your choices may not persist in this browser.");
        }
        levelSelect.value = String(level);
        updateModeButtons();
      }

      function saveSettings() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ level, mode, quiz }));
          storageNotice.classList.remove("visible");
        } catch {
          showStorageNotice("Settings could not be saved. Check this browser's storage permissions.");
        }
      }

      function showStorageNotice(message) {
        storageNotice.textContent = message;
        storageNotice.classList.add("visible");
      }

      function pitchIndex(letter, octave) {
        return octave * 7 + LETTER_INDEX[letter];
      }

      function pitchRange() {
        return [mode === "grand" ? pitchIndex("A", 1) : pitchIndex("F", 3), pitchIndex("E", 6)];
      }

      function getPitches() {
        const [min, max] = pitchRange();
        const center = pitchIndex("C", 4);
        const pitches = [];
        for (let pitch = min; pitch <= max; pitch += 1) pitches.push(pitch);

        const seeds = [pitchIndex("C", 4), pitchIndex("E", 4), pitchIndex("G", 4)];
        const ordered = [...seeds, ...pitches
          .filter(pitch => !seeds.includes(pitch))
          .sort((a, b) => Math.abs(a - center) - Math.abs(b - center) || a - b)];
        const count = Math.ceil(3 + (pitches.length - 3) * ((level - 1) / 14));
        return ordered.slice(0, count).sort((a, b) => a - b);
      }

      function svgElement(name, attributes = {}) {
        const element = document.createElementNS("http://www.w3.org/2000/svg", name);
        for (const [key, value] of Object.entries(attributes)) element.setAttribute(key, String(value));
        return element;
      }

      const yForPitch = value => 200 - (value - pitchIndex("E", 4)) * 10;

      function staffLineYs() {
        return mode === "grand"
          ? [120, 140, 160, 180, 200, 240, 260, 280, 300, 320]
          : [120, 140, 160, 180, 200];
      }

      function ledgerPitchSets() {
        const grand = mode === "grand";
        return {
          upper: [pitchIndex("A", 5), pitchIndex("C", 6), pitchIndex("E", 6)],
          lower: grand
            ? [pitchIndex("E", 2), pitchIndex("C", 2), pitchIndex("A", 1)]
            : [pitchIndex("C", 4), pitchIndex("A", 3), pitchIndex("F", 3)],
          middle: grand ? [pitchIndex("C", 4)] : []
        };
      }

      // Clefs come from a system font, and every font draws these glyphs at a
      // different size and baseline. So measure the glyph's actual ink bounds
      // and scale/position it to standard engraving proportions (in staff
      // spaces, from the SMuFL reference font Bravura):
      //   treble clef: 4.39 spaces above to 2.63 below the G line (2nd line)
      //   bass clef:   1.04 spaces above to 2.54 below the F line (4th line),
      //                so its top meets the top line and its dots straddle F.
      const CLEF_FONT = '"Noto Music", "Segoe UI Symbol", "Apple Symbols", serif';
      const SPACE = 20;
      const glyphMetrics = new Map();

      function measureGlyph(glyph) {
        if (!glyphMetrics.has(glyph)) {
          const context = document.createElement("canvas").getContext("2d");
          context.font = `100px ${CLEF_FONT}`;
          const m = context.measureText(glyph);
          glyphMetrics.set(glyph, {
            ascent: m.actualBoundingBoxAscent,
            height: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
            left: m.actualBoundingBoxLeft,
            width: m.actualBoundingBoxLeft + m.actualBoundingBoxRight
          });
        }
        return glyphMetrics.get(glyph);
      }

      function drawClef(glyph, centerX, top, bottom) {
        const m = measureGlyph(glyph);
        const scale = (bottom - top) / m.height;        // per 100px of font size
        const clef = svgElement("text", {
          x: centerX - (m.width / 2 - m.left) * scale,
          y: top + m.ascent * scale,
          class: "clef",
          "font-size": 100 * scale,
          "font-family": CLEF_FONT
        });
        clef.textContent = glyph;
        staff.append(clef);
      }

      function drawStaffBase(x1, x2, clefX) {
        const lines = staffLineYs();
        lines.forEach(y => staff.append(svgElement("line", {
          x1, x2, y1: y, y2: y, class: "staff-line"
        })));
        const gLine = lines[3];
        drawClef("\u{1D11E}", clefX, gLine - 4.39 * SPACE, gLine + 2.63 * SPACE);
        if (mode === "grand") drawBassClef(clefX, lines[6]);
      }

      // System fonts disagree on the bass clef's proportions (often the dots
      // land on lines instead of either side of F), so it is drawn as a path.
      // Units are staff spaces, origin on the F line, y pointing down.
      const BASS_CLEF_PATH = [
        "M0.15 -0.35",
        "C0.35 -0.85 0.75 -1.02 1.05 -1.02",
        "C1.75 -1.02 2.1 -0.55 2.1 0.05",
        "C2.1 1.2 1.2 2.1 0 2.6",
        "L-0.03 2.47",
        "C0.95 1.9 1.45 1.1 1.45 0.05",
        "C1.45 -0.55 1.25 -0.84 0.95 -0.84",
        "C0.72 -0.86 0.52 -0.72 0.45 -0.55Z"
      ].join(" ");

      function drawBassClef(centerX, fLine) {
        const clef = svgElement("g", {
          class: "clef",
          transform: `translate(${centerX - 1.32 * SPACE} ${fLine}) scale(${SPACE})`
        });
        clef.append(svgElement("path", { d: BASS_CLEF_PATH }));
        clef.append(svgElement("circle", { cx: 0.36, cy: 0, r: 0.34 }));   // head on the F line
        clef.append(svgElement("circle", { cx: 2.5, cy: -0.5, r: 0.15 })); // dots in the spaces
        clef.append(svgElement("circle", { cx: 2.5, cy: 0.5, r: 0.15 }));  // above and below F
        staff.append(clef);
      }

      function drawStaff(pitch) {
        staff.replaceChildren();
        staff.setAttribute("viewBox", "0 0 700 440");
        staff.style.width = "";
        const grand = mode === "grand";
        drawStaffBase(65, 635, 115);

        const y = yForPitch(pitch);
        const ledgerYs = new Set();
        const { upper: upperLedgerPitches, lower: lowerLedgerPitches } = ledgerPitchSets();
        for (const ledgerPitch of upperLedgerPitches) {
          if (pitch >= ledgerPitch) ledgerYs.add(yForPitch(ledgerPitch));
        }
        if (grand && pitch === pitchIndex("C", 4)) ledgerYs.add(yForPitch(pitchIndex("C", 4)));
        for (const ledgerPitch of lowerLedgerPitches) {
          if (pitch <= ledgerPitch) ledgerYs.add(yForPitch(ledgerPitch));
        }

        for (const lineY of ledgerYs) {
          staff.append(svgElement("line", {
            x1: 325, x2: 385, y1: lineY, y2: lineY, class: "ledger-line"
          }));
        }

        // Staff space is 20px. The notehead fills one space (≈19.4px tall
        // including its stroke) and is tilted like an engraved notehead.
        const noteX = 355;
        staff.append(svgElement("ellipse", {
          cx: noteX, cy: y, rx: 12.5, ry: 8.5, class: "notehead",
          transform: `rotate(-20 ${noteX} ${y})`
        }));

        // Stem direction follows the middle line of the note's own staff:
        // below the middle line → stem up; on or above it → stem down.
        // In the grand staff, middle C (y = 220) and above belong to the treble staff.
        const onBassStaff = grand && y > 220;
        const middleLineY = onBassStaff ? 280 : 160;
        const stemUp = y > middleLineY;

        // Standard stem length is 3.5 spaces (70px), but notes on ledger lines
        // far from the staff get a longer stem that reaches the middle line.
        const STEM_LENGTH = 70;
        const stemEndY = stemUp
          ? Math.min(y - STEM_LENGTH, middleLineY)
          : Math.max(y + STEM_LENGTH, middleLineY);

        // Attach the stem at the notehead's edge: right side for up-stems,
        // left side for down-stems (the tilt lifts the right edge slightly).
        const stemX = stemUp ? noteX + 11.5 : noteX - 11.5;
        staff.append(svgElement("line", {
          x1: stemX,
          x2: stemX,
          y1: stemUp ? y - 2 : y + 2,
          y2: stemEndY,
          class: "stem"
        }));
        staff.setAttribute("aria-label", `${grand ? "Grand staff" : "Treble staff"}, note displayed`);
      }

      // ---- "Find the note" mode -------------------------------------------
      // A window of 7 consecutive natural notes (one of each letter) is
      // highlighted on an enlarged, narrower staff; the player clicks the line
      // or space inside the blue box that matches the target letter.
      const FIND = {
        pxPerUnit: 2.5,          // enlarged size: one staff space (20 units) ≈ 50px
        width: 300,              // viewBox width (narrower than the "Name it" staff)
        lineX1: 15, lineX2: 285, clefX: 62,
        boxX: 135, boxW: 120,    // highlight box (also the clickable area)
        pad: 15                  // 1.5 steps beyond the window so neighbouring lines show
      };
      let findWindow = null;     // [lowPitch, highPitch]
      let markFind = () => {};

      function pickWindow(target) {
        const [min, max] = pitchRange();
        const lowestStart = Math.max(min, target - 6);
        const highestStart = Math.min(max - 6, target);
        const start = lowestStart + Math.floor(Math.random() * (highestStart - lowestStart + 1));
        return [start, start + 6];
      }

      function windowLedgerPitches(lo, hi) {
        const { upper, lower, middle } = ledgerPitchSets();
        return [...upper, ...lower, ...middle].filter(pitch => pitch >= lo && pitch <= hi);
      }

      function drawFindQuestion() {
        staff.replaceChildren();
        // The viewBox spans every window the current level can produce (plus the
        // staff itself) so the staff stays put from question to question.
        const [rangeMin, rangeMax] = pitchRange();
        const levelPitches = getPitches();
        const reachLow = Math.max(rangeMin, levelPitches[0] - 6);
        const reachHigh = Math.min(rangeMax, levelPitches[levelPitches.length - 1] + 6);
        const lineYs = staffLineYs();
        const viewTop = Math.min(yForPitch(reachHigh) - FIND.pad, lineYs[0] - 40) - 10;
        const viewBottom = Math.max(yForPitch(reachLow) + FIND.pad, lineYs[lineYs.length - 1] + 20) + 10;
        const viewHeight = viewBottom - viewTop;
        staff.setAttribute("viewBox", `0 ${viewTop} ${FIND.width} ${viewHeight}`);
        staff.style.width = `${FIND.width * FIND.pxPerUnit}px`;
        drawStaffBase(FIND.lineX1, FIND.lineX2, FIND.clefX);

        const [lo, hi] = findWindow;
        const top = yForPitch(hi) - FIND.pad;
        const bottom = yForPitch(lo) + FIND.pad;
        const noteX = FIND.boxX + FIND.boxW / 2;

        for (const pitch of windowLedgerPitches(lo, hi)) {
          const y = yForPitch(pitch);
          staff.append(svgElement("line", {
            x1: noteX - 26, x2: noteX + 26, y1: y, y2: y, class: "ledger-line"
          }));
        }
        staff.append(svgElement("rect", {
          x: FIND.boxX, y: top, width: FIND.boxW, height: bottom - top, rx: 4, class: "highlight-box"
        }));

        const noteLayer = svgElement("g");
        staff.append(noteLayer);

        function placeNote(note, pitch) {
          const y = yForPitch(pitch);
          note.setAttribute("cx", noteX);
          note.setAttribute("cy", y);
          note.setAttribute("transform", `rotate(-20 ${noteX} ${y})`);
        }

        function addNote(pitch, kind) {
          const note = svgElement("ellipse", { rx: 12.5, ry: 8.5, class: `notehead ${kind}` });
          placeNote(note, pitch);
          noteLayer.append(note);
          return note;
        }

        const ghost = addNote(lo, "ghost");
        ghost.style.display = "none";

        const hits = svgElement("g");
        for (let pitch = hi; pitch >= lo; pitch -= 1) {
          const y = yForPitch(pitch);
          const hit = svgElement("rect", {
            x: FIND.boxX, y: y - 5, width: FIND.boxW, height: 10,
            class: "find-hit", tabindex: 0, role: "button",
            "aria-label": `Position ${hi - pitch + 1} of 7, counting from the top`
          });
          const showGhost = () => {
            if (currentNote === null) return;
            placeNote(ghost, pitch);
            ghost.style.display = "";
          };
          hit.addEventListener("pointerenter", showGhost);
          hit.addEventListener("focus", showGhost);
          hit.addEventListener("click", () => answerFind(pitch));
          hit.addEventListener("keydown", event => {
            if (event.key === "Enter" || event.key === " ") {
              event.preventDefault();
              answerFind(pitch);
            }
          });
          hits.append(hit);
        }
        hits.addEventListener("pointerleave", () => { ghost.style.display = "none"; });
        hits.addEventListener("focusout", () => { ghost.style.display = "none"; });
        staff.append(hits);

        markFind = (pitch, kind) => {
          noteLayer.querySelectorAll(".wrong, .correct").forEach(node => node.remove());
          addNote(pitch, kind);
          if (kind === "correct") ghost.style.display = "none";
        };

        staff.setAttribute("aria-label",
          `${mode === "grand" ? "Grand staff" : "Treble staff"} with seven notes highlighted`);
      }

      function setFindPrompt(prefix = "") {
        const letter = document.createElement("span");
        letter.className = "target-letter";
        letter.textContent = LETTERS[currentNote % 7];
        feedback.replaceChildren(`${prefix}Find the `, letter, " in the blue box.");
      }

      function answerFind(pitch) {
        if (currentNote === null) return;
        const target = LETTERS[currentNote % 7];
        const clicked = LETTERS[pitch % 7];
        if (clicked === target) {
          markFind(pitch, "correct");
          score += 1;
          scoreDisplay.textContent = String(score);
          feedback.textContent = `Correct! That's ${target}.`;
          feedback.className = "feedback correct";
          currentNote = null;
          window.setTimeout(setNextNote, 750);
        } else {
          markFind(pitch, "wrong");
          setFindPrompt(`That's ${clicked}. `);
          feedback.className = "feedback incorrect";
        }
      }

      function setNextNote() {
        const pitches = getPitches();
        const available = pitches.filter(pitch => pitch !== previousPitch);
        const choices = available.length ? available : pitches;
        currentNote = choices[Math.floor(Math.random() * choices.length)];
        previousPitch = currentNote;
        description.textContent = `Level ${level} · ${pitches.length} ${pitches.length === 1 ? "note" : "notes"}`;
        feedback.className = "feedback";
        questionType = quiz === "both" ? (Math.random() < .5 ? "name" : "find") : quiz;
        const finding = questionType === "find";
        staffWrap.classList.toggle("find", finding);
        answerButtons.hidden = finding;
        hint.textContent = finding
          ? "Click the matching line or space in the blue box."
          : "You can also answer with the A–G keys.";
        if (finding) {
          findWindow = pickWindow(currentNote);
          drawFindQuestion();
          setFindPrompt();
        } else {
          drawStaff(currentNote);
          feedback.textContent = "Which note is this?";
        }
      }

      function answer(letter) {
        if (currentNote === null) return;
        const noteLetter = LETTERS[currentNote % 7];
        if (letter === noteLetter) {
          score += 1;
          scoreDisplay.textContent = String(score);
          feedback.textContent = "Correct! Here comes the next note.";
          feedback.className = "feedback correct";
          currentNote = null;
          window.setTimeout(setNextNote, 550);
        } else {
          feedback.textContent = "Not quite. Try another letter.";
          feedback.className = "feedback incorrect";
        }
      }

      function updateModeButtons() {
        modeButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        });
        quizButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.quiz === quiz));
        });      }

      optionsButton.addEventListener("click", () => optionsDialog.showModal());
      optionsDialog.addEventListener("click", event => {
        if (event.target === optionsDialog) optionsDialog.close(); // backdrop click
      });

      levelSelect.addEventListener("change", () => {
        level = Number(levelSelect.value);
        saveSettings();
        setNextNote();
      });

      modeButtons.forEach(button => {
        button.addEventListener("click", () => {
          mode = button.dataset.mode;
          updateModeButtons();
          saveSettings();
          setNextNote();
        });
      });

      quizButtons.forEach(button => {
        button.addEventListener("click", () => {
          quiz = button.dataset.quiz;
          updateModeButtons();
          saveSettings();
          setNextNote();
        });
      });

      document.querySelectorAll(".answer-button").forEach(button => {
        button.addEventListener("click", () => answer(button.dataset.letter));
      });

      document.addEventListener("keydown", event => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target instanceof HTMLSelectElement) return;
        if (optionsDialog.open) return;
        if (questionType !== "name") return;
        const letter = event.key.toUpperCase();
        if (LETTERS.includes(letter)) answer(letter);
      });

      readSettings();
      setNextNote();
    })();
  </script>
</body>
</html>
